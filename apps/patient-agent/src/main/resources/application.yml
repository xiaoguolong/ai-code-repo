server:
  port: 8082

spring:
  application:
    name: patient-agent

# 密钥只从环境变量读取，不要把真实 Key 写进本文件。
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  max-tokens: 2048
  temperature: 0.7
  timeout-seconds: 60
  # 走代理时设置（本机代理端口，空则直连）
  proxy-host: ${LLM_PROXY_HOST:}
  proxy-port: ${LLM_PROXY_PORT:7890}

# Agent 循环参数。max-iterations 兜底防止死循环烧钱。
agent:
  prompt-version: v1
  max-iterations: 5
