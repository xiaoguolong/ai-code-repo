server:
  port: 8080

spring:
  application:
    name: spring-ai-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aidemo}
    username: ${SPRING_DATASOURCE_USERNAME:aidemo}
    password: ${SPRING_DATASOURCE_PASSWORD:aidemo}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      database: 0

# 密钥只从环境变量读取，不要把真实 Key 写进本文件。
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  max-tokens: 1024
  temperature: 0.7
  timeout-seconds: 60
  # 走代理时设置（本机代理端口，空则直连）
  proxy-host: ${LLM_PROXY_HOST:}
  proxy-port: ${LLM_PROXY_PORT:7890}

chat:
  system-prompt-version: v1
  memory-provider: ${CHAT_MEMORY_PROVIDER:memory}
  max-memory-messages: 20
  audit-provider: ${CHAT_AUDIT_PROVIDER:mybatis}
  db-type: ${CHAT_DB_TYPE:postgre_sql}
