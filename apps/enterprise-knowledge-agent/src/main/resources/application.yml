server:
  port: 8081

spring:
  application:
    name: enterprise-knowledge-agent
  # 数据源不设默认值：各环境的库名/账号不同，必须由环境变量或模块 .env 提供。
  # .env 不入库（.gitignore 忽略），每套环境自建；IDEA 请用 EnvFile 插件指向本模块 .env。
  # optional 前缀保证 .env 缺失时不启动失败（缺失时由上面的变量占位报缺失，提示更明确）。
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/postgresql
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Sa-Token 登录鉴权。默认随机 UUID 令牌，有效期 30 天。
sa-token:
  token-name: satoken
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 密钥只从环境变量读取，不要把真实 Key 写进本文件。
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  max-tokens: 1024
  temperature: 0.7
  timeout-seconds: 60
  # 走代理时设置（本机代理端口，空则直连）
  proxy-host: ${LLM_PROXY_HOST:}
  proxy-port: ${LLM_PROXY_PORT:7890}

# Prompt 模板版本（由 ai-core 统一读取）。
prompt:
  version: ${PROMPT_VERSION:v1}

chat:
  db-type: ${CHAT_DB_TYPE:postgre_sql}

# 向量化。密钥只从环境变量读取。默认 hashing 离线确定性；生产设 provider=openai。
embedding:
  provider: ${EMBEDDING_PROVIDER:hashing}
  base-url: ${EMBEDDING_BASE_URL:https://ws-7x0g7r1imgk8va7t.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
  dimension: 1024
  timeout-seconds: 60

rag:
  # pgvector 已装好，生产直接落库；单测用 memory。
  vector-store: ${RAG_VECTOR_STORE:pgvector}
  default-top-k: 4
  chunk-size: 500
  chunk-overlap: 50

# 文档 OCR。密钥只从环境变量读取。
ocr:
  provider: ${OCR_PROVIDER:qianfan}
  base-url: ${OCR_BASE_URL:https://qianfan.baidubce.com}
  api-key: ${OCR_API_KEY:}
  model: ${OCR_MODEL:paddleocr-vl-0.9b}
  timeout-seconds: 120

# 登录密码哈希盐。生产必须通过环境变量覆盖，禁止用默认值。
auth:
  password-salt: ${AUTH_PASSWORD_SALT:}

# 文件上传服务。local 存本地目录；oss/obs 仅接口预留。
file:
  storage-dir: ${FILE_STORAGE_DIR:./data/files}
  public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:8081}
