spring:
  application:
    name: enterprise-knowledge-agent-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

chat:
  system-prompt-version: v1
  db-type: h2

embedding:
  provider: hashing

rag:
  vector-store: memory
  default-top-k: 4
  chunk-size: 500
  chunk-overlap: 50

ocr:
  provider: qianfan

auth:
  password-salt: test-salt

file:
  storage-dir: ./target/test-files
  public-base-url: http://localhost:8081
