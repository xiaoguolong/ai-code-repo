server:
  port: 8084

spring:
  application:
    name: spring-ai-alibaba-agent
  # 默认激活 jdbc profile（数据源与 Flyway 迁移在其配置文件里）。
  # 原因：pom 的 spring-boot.run.profiles=jdbc 只对 `mvn spring-boot:run` 生效，
  # 从 IDE 直接 Run 或 `java -jar` 不会带上它；不设默认则落库模式没有数据源，启动即失败。
  # 单测用 test profile（含 H2 数据源配置）覆盖，见 src/test/resources/application-test.yml。
  profiles:
    default: jdbc
  # Spring AI OpenAI 兼容通道，指向 DeepSeek。密钥只从环境变量读取，不要写真实 Key。
  # 注意：Spring AI 自行拼接 /v1/chat/completions，base-url 只写主机名，切勿带 /v1。
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          temperature: 0.7
    mcp:
      server:
        name: patient-tools-mcp
        version: 0.1.0
        type: SYNC

# 框架适配器选择：spring-ai 用本模块的 Spring AI 适配器；openai-compatible 用第 1 周 RestClient 适配器。
framework:
  model-provider: ${FRAMEWORK_MODEL_PROVIDER:spring-ai}
  agent:
    # 模型带工具循环上限，兜底防止死循环烧钱。
    max-iterations: 5

# ai-core 统一读取的 LLM 参数（运行时常量与统计口径）。
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  max-tokens: 2048
  temperature: 0.7
  timeout-seconds: 60
  proxy-host: ${LLM_PROXY_HOST:}
  proxy-port: ${LLM_PROXY_PORT:7890}

# Prompt 模板版本（由 ai-core 统一读取）。
prompt:
  version: ${PROMPT_VERSION:v1}

# 平台 RBAC（Week 13）。密码盐生产环境必须环境变量覆盖。
auth:
  password-salt: ${AUTH_PASSWORD_SALT:platform-dev-salt}

sa-token:
  # 会话头名与前缀（Week 19 定稿，已真机验证）。
  # 依据（读 sa-token-core 1.46.0 源码 StpLogic#getTokenValueNotCut 确认）：
  #   1) Sa-Token 只从「token-name 指定的头」取原始值，**不会**回退读其他头；
  #   2) 原始值必须以 `tokenPrefix + 空格` 开头，否则 getTokenValue() 直接返回 null（不抛异常），
  #      表现为「token 明明在，checkLogin 一律 401」。
  # 取 Authorization + Bearer 的原因：HTTP 标准头，网关/客户端/第三方工具都天然支持，
  # 不需要为「内部调用」发明第二套头。**注意 tokenPrefix 非空时不能只传裸 token**。
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400

platform:
  security:
    enforce-direct-runs: false
    web-interceptors:
      enabled: true
    # Week 22：登录 / 身份校验限流（内存滑动窗口，5 次失败封 5 分钟）。
    # verify 是 Week 21 新增的**免登录**密码校验端点，没有限流等于把撞库入口开到公网。
    rate-limit:
      enabled: ${PLATFORM_RATE_LIMIT_ENABLED:true}
      max-attempts: ${PLATFORM_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${PLATFORM_RATE_LIMIT_WINDOW_SECONDS:300}
      block-seconds: ${PLATFORM_RATE_LIMIT_BLOCK_SECONDS:300}
      # 只有前面确实有可信反代（会覆盖 X-Forwarded-For）时才置 true，
      # 否则攻击者伪造该头即可绕过限流。
      trust-forwarded-for: ${PLATFORM_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  # Week 16：RBAC / 执行记录 / 审计的持久化模式。
  # jdbc   = 落库（需同时激活 jdbc profile 提供数据源，见 application-jdbc.yml）
  # memory = 进程内（无数据库演示 / 单测）
  persistence:
    mode: ${PLATFORM_PERSISTENCE_MODE:jdbc}
  # Week 21：按 租户+用户 隔离的长期记忆（platform_memory）。
  memory:
    # 语义检索先取最近 N 条候选，再在应用侧算余弦（防止全表扫描）
    candidate-limit: ${PLATFORM_MEMORY_CANDIDATE_LIMIT:500}
    # 低于该余弦相似度的命中直接丢弃；0 表示不过滤（仍会排除 <=0 的无关项）
    min-score: ${PLATFORM_MEMORY_MIN_SCORE:0.05}
    default-top-k: ${PLATFORM_MEMORY_DEFAULT_TOP_K:5}
    max-top-k: ${PLATFORM_MEMORY_MAX_TOP_K:20}

# Week 21：记忆向量化（平台不做 RAG，维度与 embedding 模型保持一致）。
# 默认 hashing 为离线确定性实现；换真模型时 provider=openai + base-url/api-key/model 均从环境变量注入。
# 注意：因为平台之前没有 embedding 需求，这里必须把 key/base-url/model 也映射出来，
# 只写 provider 会让 EMBEDDING_API_KEY 环境变量「存在但读不到」（真机验收踩过：
# 记忆落库成功但向量为空，语义检索永远 0 命中）。
embedding:
  provider: ${EMBEDDING_PROVIDER:hashing}
  base-url: ${EMBEDDING_BASE_URL:}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:}
  dimension: ${EMBEDDING_DIMENSION:1024}
  timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}

# Week 17：可观测（OpenTelemetry）。Micrometer Tracing 门面 + OTel bridge，OTLP/HTTP 导出。
# 优雅降级：collector 未启动时导出失败只打 WARN，业务请求不受影响（与审计同口径：可观测设施不是单点）。
observability:
  # Span / 指标埋点总开关。false 时装配空实现，零 span、零指标、零开销。
  enabled: ${OBSERVABILITY_ENABLED:true}
  # Week 19：SkyWalking 手动埋点（服务拓扑与 HTTP/JDBC/Redis/JVM 由 Java Agent 自动获取，
  # 本开关只控制我们自己的 agent.run / llm.chat / tool.call 业务 span 是否叠加）。
  # 注意：Java Agent 由启动参数 -javaagent 决定，无法用本文件控制（见 docs/deploy/week-19-skywalking.md）。
  skywalking:
    enabled: ${SKYWALKING_ENABLED:false}
    # 下面两项只用于自检展示；真实生效值是启动参数 SW_AGENT_NAME / SW_AGENT_COLLECTOR_BACKEND_SERVICES
    service-name: ${SW_AGENT_NAME:}
    backend-service: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:}
    tag-prefix: aicode

# Week 18：Langfuse（LLM Trace / Prompt 管理 / Token 与成本分析）。
# 默认全关：既不打网络也不产生 langfuse.* 属性；密钥只从环境变量或模块 .env 读取，禁止写进本文件。
# 追踪（enabled）与 Prompt 管理（prompt.enabled）是两个独立能力：Prompt 管理只需要 host + 密钥。
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  # Langfuse Web 根地址（不要带 /api 路径）；OTLP 摄取端点是 <host>/api/public/otel/v1/traces
  host: ${LANGFUSE_HOST:http://localhost:3000}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  # 项目 ID 仅用于拼 UI 深链（langfuse-status / trace-context 里的 langfuseTraceUrl）
  project-id: ${LANGFUSE_PROJECT_ID:}
  environment: ${LANGFUSE_ENVIRONMENT:local}
  release: ${LANGFUSE_RELEASE:}
  # Prompt / 输出正文采集：默认关闭。开启时必须同时启用 guardrail 脱敏，否则采集自动失效（不发未脱敏数据）。
  capture-content: ${LANGFUSE_CAPTURE_CONTENT:false}
  max-content-chars: ${LANGFUSE_MAX_CONTENT_CHARS:2000}
  timeout-ms: ${LANGFUSE_TIMEOUT_MS:10000}
  prompt:
    enabled: ${LANGFUSE_PROMPT_ENABLED:false}
    label: ${LANGFUSE_PROMPT_LABEL:production}
    cache-ttl-seconds: ${LANGFUSE_PROMPT_CACHE_TTL_SECONDS:60}
  # 模型价目表（应用侧，单位：USD / 百万 token）。作用：
  #   1) generation 观测上下发 langfuse.observation.cost_details（客户端上报，优先于服务端推断）；
  #   2) 记 Prometheus 指标 llm_cost_usd_total；
  #   3) 供 GET /api/v1/platform/observability/llm-cost-summary 汇总。
  # 单价全为 0（或整行留空）视为未配置：此时不下发 cost、不记成本指标，成本改由 Langfuse 侧按模型定义推断。
  # 键名不能改（要与模型返回的 model 名一致）；数值可用环境变量覆盖，换环境不必改文件。
  # 注意：这里的值是占位示例，请按你的实际账单单价填写。
  model-prices:
    deepseek-v4-pro:
      input-per-1m: ${LANGFUSE_PRICE_DEEPSEEK_V4_PRO_INPUT:0.27}
      output-per-1m: ${LANGFUSE_PRICE_DEEPSEEK_V4_PRO_OUTPUT:1.10}
    # .env.example 里的默认模型是 deepseek-chat，一并给出（未用到时可删）
    deepseek-chat:
      input-per-1m: ${LANGFUSE_PRICE_DEEPSEEK_CHAT_INPUT:0.27}
      output-per-1m: ${LANGFUSE_PRICE_DEEPSEEK_CHAT_OUTPUT:1.10}

# Week 20：完整监控体系（Prometheus + Grafana 统一纳管）。
# 本段只服务「自检接口 GET /api/v1/platform/observability/monitoring-overview」与深链展示，
# 不参与数据上报（上报路径仍是 /actuator/prometheus 与 OTLP）。地址默认走本机回环，
# 本地应用 + 云端中间件场景由 tools\tunnel.ps1 的 19090/3001 本地转发打通。
monitoring:
  enabled: ${MONITORING_ENABLED:true}
  probe:
    # 单个探针超时：三个探针串行最坏 2.4s；配合 30s 缓存，自检接口不会被打爆。
    timeout-ms: ${MONITORING_PROBE_TIMEOUT_MS:800}
    cache-ttl-seconds: ${MONITORING_PROBE_CACHE_TTL_SECONDS:30}
  prometheus:
    base-url: ${PROMETHEUS_BASE_URL:http://127.0.0.1:19090}
    # 平台自己的指标路径（展示用，实际抓取由 Prometheus 配置决定）
    self-metrics-path: ${PROMETHEUS_SELF_METRICS_PATH:/actuator/prometheus}
    ready-path: ${PROMETHEUS_READY_PATH:/-/ready}
  grafana:
    base-url: ${GRAFANA_BASE_URL:http://127.0.0.1:3001}
    # 必须与 deploy/grafana/dashboards 里 JSON 的 uid 一致
    dashboard-uid: ${GRAFANA_DASHBOARD_UID:aicode-platform-overview}
  otel:
    # 与 management.otlp.tracing.* 使用同一组环境变量，避免两处配置漂移
    trace-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    sampling-probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
    export-enabled: ${OTEL_EXPORT_ENABLED:true}
  links:
    skywalking-ui-url: ${SKYWALKING_UI_URL:http://127.0.0.1:8088}
  targets:
    # Prometheus 的第二个抓取目标：网关 8080 的指标出口（Week 20 新开）
    gateway-metrics-url: ${GATEWAY_METRICS_URL:http://127.0.0.1:8080/actuator/prometheus}

management:
  metrics:
    tags:
      # 公共标签：两个应用抓进同一个 Prometheus 后，Grafana 用 application 区分曲线
      application: ${APP_METRICS_TAG:ai-code-platform}
    distribution:
      # Week 20：为 Timer 生成直方图桶。否则 Prometheus 只有 _count/_sum，
      # Grafana 的 P95 面板与 alerts.yml 的 histogram_quantile 会永远为空（实测踩过）。
      percentiles-histogram:
        agent.run.duration: true
        llm.call.duration: true
        http.server.requests: true
      # 默认桶上界是 30s，而一次 Agent 执行 / 一次 LLM 调用经常 30–60s：
      # 超过上界的观测只会落进 +Inf，histogram_quantile 直接返回 NaN（Grafana P95 空白）。
      maximum-expected-value:
        agent.run.duration: 120s
        llm.call.duration: 120s
        http.server.requests: 30s
  tracing:
    enabled: true
    # 采样率：演示/验收取 1.0 保证 span 全落；生产环境按容量用环境变量降到 0.1 量级。
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
    propagation:
      type: W3C
  otlp:
    tracing:
      # OTLP/HTTP 端点。Jaeger all-in-one、OTel Collector、Tempo 均可；
      # 标准环境变量 OTEL_EXPORTER_OTLP_ENDPOINT 只写根地址（如 http://<collector-host>:4318）。
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      # 单测置 false，避免测试期打网络（不改为空串：OTLP 端点不支持 disable 语义）
      export:
        enabled: ${OTEL_EXPORT_ENABLED:true}
  endpoints:
    web:
      exposure:
        # 指标出口：/actuator/prometheus（Prometheus 文本格式）；health/info 供探活与发布信息
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 不对外暴露组件细节（数据库地址、磁盘路径等）
      show-details: never

# Guardrail 内容安全（Week 14）。与 RBAC 正交。
guardrail:
  enabled: true
  max-input-length: 8192
  block-prompt-injection: true
  sanitize-output: true
  allowed-tool-argument-keys:
    - patientId
    - task

# Agent / Workflow / Platform 关键步骤日志（控制台可 grep "[platform]" "[multi-agent]" "[workflow]" "[framework-agent]"）
# 日志格式强制带 traceId（%X{traceId}），与响应头 X-Trace-Id 一致，便于全链路排查。
logging:
  level:
    com.aicode.framework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# 落库模式的数据源与 Flyway 迁移见 application-jdbc.yml，用 --spring.profiles.active=jdbc 激活
# （mvn spring-boot:run 已配 spring-boot.run.profiles=jdbc；单测用 test profile 提供 H2）。
