# Week 29：平台前端同域部署（nginx）
# /        -> /opt/ai-code/web 静态 SPA
# /api/    -> 平台 8084（保留 /api 前缀）
# /ent/api/ -> enterprise 8081（去掉 /ent 前缀；SPA 路由 /ent/knowledge 走静态）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/ai-code/web;
    index index.html;
    client_max_body_size 20m;

    access_log /var/log/nginx/aicode.access.log;
    error_log  /var/log/nginx/aicode.error.log warn;

    # Week 31：SSE 流式执行。必须单独关缓冲，否则 nginx 会把 token 攒到结束才下发，
    # 表现为"首字=总耗时"。正则 location 优先于 /api/ 前缀；read timeout 要 ≥ 平台流式超时（300s）。
    location ~ ^/api/v1/platform/agents/[^/]+/runs/stream$ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 只代理企业 API；/ent/knowledge 是 SPA 路由，必须落到静态 fallback
    location /ent/api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
