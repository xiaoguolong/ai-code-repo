# Week 29：平台前端同域部署（nginx）
# /        -> /opt/ai-code/web 静态 SPA
# /api/    -> 平台 8084（保留 /api 前缀）
# /ent/    -> enterprise 8081（去掉 /ent 前缀，第 30 周企业页用）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/ai-code/web;
    index index.html;
    client_max_body_size 20m;

    access_log /var/log/nginx/aicode.access.log;
    error_log  /var/log/nginx/aicode.error.log warn;

    location /api/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ent/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
